---
layout: default
---

{% include base_path %}

<style>
  /* =========================================
     1. MOBILE ONLY (Phones & Tablets)
     (This code stops working completely if screen > laptop size)
     ========================================= */
  @media (max-width: 63.9em) {
    
    .flex-wrapper {
      display: block !important;
      width: 90% !important; /* 90% width looks cleaner on phone than edge-to-edge */
      margin: 0 auto !important;
    }
    
    .custom-sidebar {
      width: 100% !important;
      margin-right: 0 !important;
      margin-bottom: 30px !important;
      text-align: center !important;
    }

    /* THE FIX: TARGET THE CONTAINER, NOT JUST THE IMAGE */
    /* This forces the 'wrapper' to stop being small */
    .custom-sidebar .author__profile,
    .custom-sidebar .author__avatar {
      width: 100% !important;
      max-width: 100% !important;
      display: block !important;
    }

    /* Target the image itself */
    .custom-sidebar .author__avatar img {
      width: 100% !important;  /* Fills the screen */
      max-width: 100% !important;
      height: auto !important;
    }

    .custom-content {
      width: 100% !important;
      padding: 0 !important;
    }
  }

  /* =========================================
     2. DESKTOP ONLY (Computer)
     (I have NOT touched this logic. It is safe.)
     ========================================= */
  @media (min-width: 64em) {
    
    .flex-wrapper {
      display: flex !important;
      flex-direction: row !important;
      width: 98vw !important;
      max-width: 98vw !important;
      align-items: flex-start !important;
    }

    .custom-sidebar {
      width: 320px !important;
      min-width: 320px !important;
      margin-right: 25px !important;
      margin-bottom: 0 !important;
      text-align: left !important;
      font-size: 0.9em !important;
    }

    /* The "80% Center" Look you like */
    .custom-sidebar .author__avatar img,
    .custom-sidebar .author__content,
    .custom-sidebar .sidebar {
      width: 90% !important;
      max-width: 90% !important;
      margin-left: auto !important;
      margin-right: auto !important;
      display: block !important;
    }

    .custom-content {
      flex: 1 !important;
      width: auto !important;
    }
  }
</style>

<div id="main" role="main" class="flex-wrapper">

  <div class="sidebar sticky custom-sidebar">
    {% include sidebar.html %}
  </div>

  <article class="page custom-content" itemscope itemtype="http://schema.org/CreativeWork">
    <div class="page__inner-wrap" style="width: 100%;">
      
      <section class="page__content" itemprop="text">
        {{ content }}
      </section>

      <footer class="page__meta">
        {% include page__taxonomy.html %}
      </footer>

    </div>
  </article>

</div>
