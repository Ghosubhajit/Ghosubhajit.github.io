---
layout: default
---

{% include base_path %}

<style>
  /* --- 1. MOBILE DEFAULTS (Phone & Tablet) --- */
  .flex-wrapper {
    display: block !important;
    width: 95% !important; 
    margin: 0 auto !important;
  }
  
  .custom-sidebar {
    width: 100% !important; 
    margin-right: 0 !important;
    margin-bottom: 30px !important; 
    text-align: center !important; 
  }

  /* FIX: MAKE MOBILE PICTURE BIG (100%) */
  .custom-sidebar .author__avatar img,
  .custom-sidebar .author__content,
  .custom-sidebar .sidebar {
    width: 100% !important; /* <--- CHANGED THIS from 60% to 100% */
    max-width: 100% !important; 
    margin: 0 auto !important; 
    display: block !important;
  }

  .custom-content {
    width: 100% !important;
    padding: 0 !important;
  }

  /* --- 2. DESKTOP OVERRIDES (Computer Only) --- */
  /* This section only activates on larger screens */
  @media (min-width: 64em) {
    
    .flex-wrapper {
      display: flex !important;
      flex-direction: row !important;
      width: 98vw !important;
      max-width: 98vw !important;
      align-items: flex-start !important;
    }

    .custom-sidebar {
      width: 320px !important;
      min-width: 320px !important;
      margin-right: 25px !important;
      margin-bottom: 0 !important;
      text-align: left !important; 
    }

    /* Keep Desktop Picture at 80% (The "Sweet Spot") */
    .custom-sidebar .author__avatar img,
    .custom-sidebar .author__content,
    .custom-sidebar .sidebar {
      width: 80% !important;
      max-width: 80% !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }

    .custom-content {
      flex: 1 !important;
      width: auto !important;
    }
  }
</style>

<div id="main" role="main" class="flex-wrapper">

  <div class="sidebar sticky custom-sidebar">
    {% include sidebar.html %}
  </div>

  <article class="page custom-content" itemscope itemtype="http://schema.org/CreativeWork">
    <div class="page__inner-wrap" style="width: 100%;">
      
      <section class="page__content" itemprop="text">
        {{ content }}
      </section>

      <footer class="page__meta">
        {% include page__taxonomy.html %}
      </footer>

    </div>
  </article>

</div>
