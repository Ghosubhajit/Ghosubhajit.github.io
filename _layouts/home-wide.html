---
layout: default
---

{% include base_path %}

<style>
  /* A. The Flex Container */
  .flex-wrapper {
    display: flex !important;
    width: 98vw !important;
    max-width: 98vw !important;
    margin: 0 auto !important;
    align-items: flex-start !important;
  }

  /* B. The Sidebar (SCALED DOWN to 80%) */
  .custom-sidebar {
    /* Reduced from 400px to 320px (80% size) */
    width: 320px !important;      
    min-width: 320px !important;  
    margin-right: 25px !important; /* Slightly more breathing room for the text */
    padding: 0 !important;
    
    /* Optional: Make the bio text slightly smaller to match the smaller pic */
    font-size: 0.9em !important; 
  }

  /* C. Force Picture to Fill the New Width */
  .custom-sidebar .author__avatar img,
  .custom-sidebar .author__content,
  .custom-sidebar .sidebar {
    width: 100% !important;
    max-width: 100% !important;
    display: block !important;
    padding-right: 0 !important;
  }

  /* D. The Content (Auto-Fills the rest) */
  .custom-content {
    flex: 1 !important;
    width: auto !important;
    margin: 0 !important;
    padding: 0 !important;
  }
</style>

<div id="main" role="main" class="flex-wrapper">

  <div class="sidebar sticky custom-sidebar">
    {% include sidebar.html %}
  </div>

  <article class="page custom-content" itemscope itemtype="http://schema.org/CreativeWork">
    <div class="page__inner-wrap" style="width: 100%;">
      
      <section class="page__content" itemprop="text">
        {{ content }}
      </section>

      <footer class="page__meta">
        {% include page__taxonomy.html %}
      </footer>

    </div>
  </article>

</div>
