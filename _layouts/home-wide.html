---
layout: default
---

{% include base_path %}

<style>
  /* A. The Flex Container (Holds Sidebar & Text together) */
  .flex-wrapper {
    display: flex !important;
    width: 98vw !important;
    max-width: 98vw !important;
    margin: 0 auto !important;
    align-items: flex-start !important; /* Aligns top of picture and text */
  }

  /* B. The Sidebar (The Frame) */
  .custom-sidebar {
    width: 400px !important;      /* WIDER: 400px (Change this number to resize) */
    min-width: 400px !important;  /* Locks the size so it doesn't shrink */
    margin-right: 20px !important; /* Small breathing room between sidebar and text */
    padding: 0 !important;        /* Remove internal padding that causes gaps */
  }

  /* C. THE KEY FIX: Force Picture & Bio to Fill the Frame */
  /* This tells the picture to use ALL 400px, leaving no empty space */
  .custom-sidebar .author__avatar img,
  .custom-sidebar .author__content,
  .custom-sidebar .sidebar {
    width: 100% !important;
    max-width: 100% !important;
    display: block !important;
    padding-right: 0 !important;
  }

  /* D. The Content (Fills the rest) */
  .custom-content {
    flex: 1 !important;           /* Takes all remaining space */
    width: auto !important;
    margin: 0 !important;
    padding: 0 !important;
  }
</style>

<div id="main" role="main" class="flex-wrapper">

  <div class="sidebar sticky custom-sidebar">
    {% include sidebar.html %}
  </div>

  <article class="page custom-content" itemscope itemtype="http://schema.org/CreativeWork">
    <div class="page__inner-wrap" style="width: 100%;">
      
      <section class="page__content" itemprop="text">
        {{ content }}
      </section>

      <footer class="page__meta">
        {% include page__taxonomy.html %}
      </footer>

    </div>
  </article>

</div>
