---
layout: default
---

{% include base_path %}

<style>
  /* --- 1. MOBILE DEFAULTS (Phone & Tablet) --- */
  /* By default, we STACK things vertically. This fixes the mobile view. */
  .flex-wrapper {
    display: block !important;
    width: 95% !important; /* Use 95% of phone screen */
    margin: 0 auto !important;
  }
  
  .custom-sidebar {
    width: 100% !important; /* Full width on phone */
    margin-right: 0 !important;
    margin-bottom: 30px !important; /* Gap between pic and bio */
    text-align: center !important; /* Center the text on phone */
  }

  /* Center the image on mobile */
  .custom-sidebar .author__avatar img,
  .custom-sidebar .author__content,
  .custom-sidebar .sidebar {
    width: 60% !important; /* Smaller image on phone looks better */
    max-width: 250px !important; 
    margin: 0 auto !important; /* Center it */
    display: block !important;
  }

  .custom-content {
    width: 100% !important;
    padding: 0 !important;
  }

  /* --- 2. DESKTOP OVERRIDES (Computer Only) --- */
  /* This code ONLY activates if the screen is wider than 1024px (Laptops/PCs) */
  @media (min-width: 64em) {
    
    /* Turn on the "Side-by-Side" Flexbox */
    .flex-wrapper {
      display: flex !important;
      flex-direction: row !important;
      width: 98vw !important;
      max-width: 98vw !important;
      align-items: flex-start !important;
    }

    /* Restore the Fixed Sidebar Width (320px) */
    .custom-sidebar {
      width: 320px !important;
      min-width: 320px !important;
      margin-right: 25px !important;
      margin-bottom: 0 !important;
      text-align: left !important; /* Left align on computer */
    }

    /* Restore the "80% Width" look you liked for Desktop */
    .custom-sidebar .author__avatar img,
    .custom-sidebar .author__content,
    .custom-sidebar .sidebar {
      width: 90% !important;
      max-width: 90% !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }

    /* Content takes remaining space */
    .custom-content {
      flex: 1 !important;
      width: auto !important;
    }
  }
</style>

<div id="main" role="main" class="flex-wrapper">

  <div class="sidebar sticky custom-sidebar">
    {% include sidebar.html %}
  </div>

  <article class="page custom-content" itemscope itemtype="http://schema.org/CreativeWork">
    <div class="page__inner-wrap" style="width: 100%;">
      
      <section class="page__content" itemprop="text">
        {{ content }}
      </section>

      <footer class="page__meta">
        {% include page__taxonomy.html %}
      </footer>

    </div>
  </article>

</div>
