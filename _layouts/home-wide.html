---
layout: default
---

{% include base_path %}

<style>
  /* --- 1. MOBILE DEFAULTS (Phone & Tablet) --- */
  .flex-wrapper {
    display: block !important;
    width: 95% !important; 
    margin: 0 auto !important;
  }
  
  .custom-sidebar {
    width: 100% !important; 
    margin-right: 0 !important;
    margin-bottom: 30px !important; 
    text-align: center !important; 
  }

  /* Mobile Picture: BIG (100% Width) */
  .custom-sidebar .author__avatar img,
  .custom-sidebar .author__content,
  .custom-sidebar .sidebar {
    width: 100% !important; 
    max-width: 100% !important; 
    margin: 0 auto !important; 
    display: block !important;
  }

  .custom-content {
    width: 100% !important;
    padding: 0 !important;
  }

  /* --- 2. DESKTOP OVERRIDES (Computer Only) --- */
  @media (min-width: 64em) {
    
    .flex-wrapper {
      display: flex !important;
      flex-direction: row !important;
      width: 98vw !important;
      max-width: 98vw !important;
      align-items: flex-start !important;
    }

    .custom-sidebar {
      width: 320px !important;
      min-width: 320px !important;
      margin-right: 25px !important;
      margin-bottom: 0 !important;
      text-align: left !important; 
    }

    /* Desktop Picture Width (90%) */
    .custom-sidebar .author__avatar img,
    .custom-sidebar .author__content,
    .custom-sidebar .sidebar {
      width: 90% !important;
      max-width: 90% !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }

    .custom-content {
      flex: 1 !important;
      width: auto !important;
    }

    /* *** FIXED: GAP BEFORE TITLE *** */
    /* This pushes the title DOWN from the top */
    .page__title {
      margin-top: 50px !important;    /* <--- GAP AT THE TOP */
      margin-bottom: 10px !important; /* Standard gap below */
    }
  }
</style>

<div id="main" role="main" class="flex-wrapper">

  <div class="sidebar sticky custom-sidebar">
    {% include sidebar.html %}
  </div>

  <article class="page custom-content" itemscope itemtype="http://schema.org/CreativeWork">
    <div class="page__inner-wrap" style="width: 100%;">
      
      {% if page.title %}
        <header>
          <h1 class="page__title" itemprop="headline" style="line-height: 1;">
            {{ page.title | markdownify | strip_html | strip_newlines | escape_once }}
          </h1>
        </header>
      {% endif %}
      
      <section class="page__content" itemprop="text">
        {{ content }}
      </section>

      <footer class="page__meta">
        {% include page__taxonomy.html %}
      </footer>

    </div>
  </article>

</div>
