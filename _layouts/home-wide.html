---
layout: default
---

{% include base_path %}

<style>
  .sidebar .author__avatar img {
    width: 100% !important;
    max-width: 100% !important;
    display: block !important;
    object-fit: cover !important; /* Ensures the photo looks good stretched */
  }
  .sidebar .author__content {
    width: 100% !important;
  }
</style>

<div id="main" role="main" style="width: 98vw; max-width: 98vw; margin-left: auto; margin-right: auto; margin-top: 0; padding-top: 0;">

  <div class="sidebar sticky" style="width: 500px; float: left; margin-right: 0px; display: block; padding-right: 20px;">
    {% include sidebar.html %}
  </div>

  <article class="page" itemscope itemtype="http://schema.org/CreativeWork" style="width: calc(100% - 500px); float: left; padding: 0; margin: 0;">
    
    <div class="page__inner-wrap" style="width: 100%; margin: 0; padding: 0;">
      
      <section class="page__content" itemprop="text" style="width: 100%; margin: 0; padding: 0;">
        {{ content }}
      </section>

      <footer class="page__meta">
        {% include page__taxonomy.html %}
      </footer>

    </div>
  </article>
</div>
