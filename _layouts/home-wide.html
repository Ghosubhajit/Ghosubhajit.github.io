---
layout: default
---

{% include base_path %}

<div id="main" role="main" style="width: 98vw; max-width: 98vw; margin-left: auto; margin-right: auto; margin-top: 0; padding-top: 0;">

  <div class="sidebar sticky" style="width: 900px; float: left; margin-right: 10px; display: block;">
    {% include sidebar.html %}
  </div>

  <article class="page" itemscope itemtype="http://schema.org/CreativeWork" style="width: calc(100% - 910px); float: left; padding: 0; margin: 0;">
    
    <div class="page__inner-wrap" style="width: 100%; margin: 0; padding: 0;">
      
      <section class="page__content" itemprop="text" style="width: 100%; margin: 0; padding: 0;">
        {{ content }}
      </section>

      <footer class="page__meta">
        {% include page__taxonomy.html %}
      </footer>

    </div>
  </article>
</div>
