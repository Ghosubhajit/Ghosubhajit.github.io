{% if page.url == "/" %}
<style>
  @media (min-width: 64em) {
    
    /* --- 1. DESTROY THE TOP GAP (Nuclear Option) --- */
    /* Target the navigation bar bottom */
    .masthead {
      margin-bottom: 0 !important;
      padding-bottom: 0 !important;
      border-bottom: none !important;
    }
    /* Target the page container top */
    .initial-content, .page__inner-wrap, .page__content, .page {
      margin-top: 0 !important;
      padding-top: 0 !important;
    }
    /* Hide Breadcrumbs if they are taking up invisible space */
    nav.breadcrumbs {
      display: none !important;
    }

    /* --- 2. MAX WIDTH (No Gaps on Right) --- */
    .page__inner-wrap {
      max-width: 100% !important; /* Full screen width */
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* --- 3. SIDEBAR (20%) --- */
    .sidebar {
      width: 20% !important;
      float: left !important;
      margin: 0 !important;
      padding-top: 10px !important; /* Give the photo a tiny bit of air */
      padding-right: 10px !important; /* Internal spacing so it doesn't touch text */
      display: block !important;
    }

    /* --- 4. CONTENT (80%) --- */
    /* 20% Sidebar + 80% Content = 100% (Perfect Fit) */
    .page__content {
      width: 80% !important;
      float: left !important;
      margin: 0 !important;
      padding: 0 !important;
      padding-top: 10px !important; /* Match sidebar spacing */
    }

    /* --- 5. HIDE GHOST COLUMNS --- */
    .sidebar__right, .toc, .toc__menu {
      display: none !important;
    }
  }
</style>
{% endif %}
