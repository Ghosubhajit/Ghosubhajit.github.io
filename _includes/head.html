{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">







{% if page.url == "/" %}
<style>
  @media (min-width: 64em) {
    /* 1. UNLOCK THE PARENT CONTAINERS (The "Frame") */
    /* This overrides the theme's default max-width limit */
    body, .initial-content, .page, .layout--single, .layout--archive {
      max-width: 100vw !important; /* 100% of the viewport width */
      margin-left: auto !important;
      margin-right: auto !important;
      padding-right: 0 !important;
    }

    /* 2. STRETCH THE INNER WRAPPER */
    .page__inner-wrap {
      max-width: 95vw !important; /* Use 95% of the total screen width */
      width: 95vw !important;
      margin: 0 auto !important; /* Center it */
      padding-right: 0 !important;
    }

    /* 3. REALIGN CONTENT AND SIDEBAR */
    /* Sidebar gets 20% */
    .sidebar {
      width: 20% !important;
      float: left !important;
      margin-right: 2% !important;
      display: block !important;
    }

    /* Text gets the rest (approx 75%) */
    .page__content {
      width: 75% !important;
      max-width: 75% !important;
      float: right !important;
      margin-right: 0 !important;
      padding-right: 0 !important;
    }
  }
</style>
{% endif %}
