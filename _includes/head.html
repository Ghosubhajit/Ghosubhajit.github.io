{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">




{% if page.url == "/" %}
<style>
  @media (min-width: 64em) {
    /* 1. MAKE THE FRAME WIDE (Use 95% of screen) */
    .page__inner-wrap {
      max-width: 95vw !important;
      width: 95vw !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }

    /* 2. SIDEBAR (Left Panel) */
    .sidebar {
      width: 20% !important;
      float: left !important;
      margin-right: 3% !important; /* Spacing between pic and text */
      display: block !important;
    }

    /* 3. CONTENT (Right Panel) */
    /* We use 75% to ensure it fits next to the sidebar without dropping */
    .page__content {
      width: 75% !important; 
      float: left !important; /* Float LEFT to stick it to the sidebar */
      margin-right: 0 !important;
      padding-right: 0 !important;
    }

    /* 4. REMOVE GHOST ELEMENTS */
    .sidebar__right, .toc, .toc__menu {
      display: none !important;
    }
  }
</style>
{% endif %}
