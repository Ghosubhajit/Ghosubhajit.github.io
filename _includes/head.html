{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">






{% if page.url == "/" %}
<style>
  @media (min-width: 64em) {
    
    /* --- 1. REMOVE THE TOP GAP --- */
    /* This pulls the content up to touch the menu */
    .page__inner-wrap {
      margin-top: 0 !important;
      padding-top: 10px !important; /* Tiny gap just so it doesn't hit the line */
    }
    .page {
      margin-top: 0 !important;
    }

    /* --- 2. MAKE THE FRAME WIDE --- */
    .page__inner-wrap {
      max-width: 95vw !important;
      width: 95vw !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }

    /* --- 3. SIDEBAR (Left Panel) --- */
    .sidebar {
      width: 20% !important;
      float: left !important;
      margin-right: 3% !important;
      display: block !important;
      margin-top: 0 !important; /* Pull sidebar up too */
    }

    /* --- 4. CONTENT (Right Panel) --- */
    .page__content {
      width: 75% !important; 
      float: left !important; 
      margin-right: 0 !important;
      padding-right: 0 !important;
      margin-top: 0 !important; /* Pull text up too */
    }

    /* --- 5. REMOVE GHOST ELEMENTS --- */
    .sidebar__right, .toc, .toc__menu {
      display: none !important;
    }
  }
</style>
{% endif %}
