{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">



{% if page.url == "/" %}
<style>
  @media (min-width: 64em) {
    
    /* --- 1. KILL THE TOP GAP (The "Vacuum" Fix) --- */
    /* We target every possible container that holds spacing */
    .initial-content, #main, .page, .page__inner-wrap {
      margin-top: 0 !important;
      padding-top: 0 !important;
    }
    
    /* If the gap is still there, this pulls everything up manually */
    .page__inner-wrap {
      margin-top: -50px !important; /* Pulls it up slightly to close any hidden gaps */
    }

    /* --- 2. UNLOCK THE FRAME --- */
    .page__inner-wrap {
      max-width: 98vw !important; /* Use 98% of screen (almost full width) */
      width: 98vw !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }

    /* --- 3. SIDEBAR (Left Panel) --- */
    .sidebar {
      width: 20% !important;
      float: left !important;
      margin-right: 2% !important; /* Reduced gap to make it tighter */
      display: block !important;
      margin-top: 0 !important;
    }

    /* --- 4. CONTENT (Right Panel) --- */
    /* 20% (Sidebar) + 2% (Margin) + 78% (Content) = 100% --> NO GAPS */
    .page__content {
      width: 78% !important; 
      float: left !important; 
      margin-right: 0 !important;
      padding-right: 0 !important;
      margin-top: 0 !important;
    }

    /* --- 5. REMOVE GHOST ELEMENTS --- */
    .sidebar__right, .toc, .toc__menu {
      display: none !important;
    }
  }
</style>
{% endif %}
