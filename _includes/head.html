{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">


{% if page.url == "/" %}
<style>
  @media (min-width: 64em) {
    
    /* 1. MAKE THE CONTAINER WIDE */
    .page__inner-wrap {
      max-width: 95vw !important; /* 95% of screen width */
      width: 95vw !important;
      margin-left: auto !important;
      margin-right: auto !important;
      
      /* ENABLE FLEXBOX (The Magic) */
      display: flex !important;
      flex-direction: row !important;
      align-items: flex-start !important; /* Aligns top of sidebar/text */
    }

    /* 2. FIX THE SIDEBAR (Left) */
    .sidebar {
      width: 250px !important; /* Fixed width for profile */
      min-width: 250px !important;
      margin-right: 30px !important; /* Gap between bio and text */
      margin-top: 0 !important; /* Pull it up */
      float: none !important; /* Disable float */
    }

    /* 3. FIX THE CONTENT (Right) */
    .page__content {
      flex: 1 !important; /* "Take all remaining space" */
      width: auto !important;
      float: none !important; /* Disable float */
      margin-right: 0 !important;
      padding-right: 0 !important;
      margin-top: 0 !important; /* Pull it up */
    }

    /* 4. KILL THE TOP GAP (Targeting the Title) */
    /* Often the H1 title pushes everything down */
    .page__title {
      margin-top: 0 !important;
      padding-top: 0 !important;
    }
    
    /* 5. HIDE GHOSTS */
    .sidebar__right, .toc, .toc__menu {
      display: none !important;
    }
  }
</style>
{% endif %}
